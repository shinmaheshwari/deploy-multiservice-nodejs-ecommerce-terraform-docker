server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS; lets nginx start even if a backend isn't up yet
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /svc/user/    { set $up http://user-service:3001;    rewrite ^/svc/user/(.*)$ /$1 break;    proxy_pass $up; }
  location /svc/product/ { set $up http://product-service:3002; rewrite ^/svc/product/(.*)$ /$1 break; proxy_pass $up; }
  location /svc/cart/    { set $up http://cart-service:3003;    rewrite ^/svc/cart/(.*)$ /$1 break;    proxy_pass $up; }
  location /svc/order/   { set $up http://order-service:3004;   rewrite ^/svc/order/(.*)$ /$1 break;   proxy_pass $up; }

  # React Router (SPA) fallback
  location / { try_files $uri /index.html; }
}
